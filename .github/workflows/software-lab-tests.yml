name: Software-only H.E.R.B.I.E. lab tests
on:
  pull_request:
    paths:
      - 'research_lab/**'
      - '.github/workflows/software-lab-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile isolated simulator and tests
        run: python -m compileall -q research_lab
      - name: Run simulation-only tests (no hardware, secrets, or network)
        run: python -m unittest discover -s research_lab -p 'test_*.py' -v
      - name: Assert tracked files unchanged
        run: git diff --exit-code
