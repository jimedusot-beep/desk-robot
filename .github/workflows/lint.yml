name: Desk Robot undefined-name lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desk-robot-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  undefined-names:
    name: ruff E9,F63,F7,F82 (syntax / undefined names / type params)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.6,<1'
      - name: Undefined-name and hard-error lint (deliberately narrow)
        run: ruff check --select E9,F63,F7,F82 .
